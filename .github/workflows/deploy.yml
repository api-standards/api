name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/548398180934/locations/global/workloadIdentityPools/github/providers/github
          # Impersonate a service account: firebase.googleapis.com rejects direct
          # Workload Identity Federation tokens.
          service_account: github-deployer@api-standards.iam.gserviceaccount.com
          project_id: api-standards

      - name: Build and deploy
        run: ./kotlin do deploy

      - name: Deploy Firebase Hosting
        run: npx --yes firebase-tools deploy --only hosting --project api-standards --non-interactive --debug || { cat firebase-debug.log 2>/dev/null; exit 1; }
