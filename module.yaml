product: jvm/app

dependencies:
  - net.mbonnin.galak:galak-ktor:0.0.0
  - io.ktor:ktor-server-netty:3.5.2
  - org.slf4j:slf4j-simple:2.0.13

settings:
  jvm:
    mainClass: apistandards.MainKt
  kotlin:
    ksp:
      processors:
        - net.mbonnin.galak:galak-processor:0.0.0
      # The Galak Gradle plugin normally sets these. Kotlin Toolchain has no Galak plugin, so they're set by hand.
      processorOptions:
        galakService: service
        galakPackageName: apistandards
